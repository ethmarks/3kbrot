<body>
	<canvas id="c"></canvas>
	<div id="t">
		<h1>3kbrot <span id="r">(Rendering...)</span></h1>

		<p>
			A Mandelbrot Set viewer in 3kb. Source:
			<a href="https://github.com/ethmarks/3kbrot"
				>https://github.com/ethmarks/3kbrot</a
			>
		</p>

		<label for="izr">Inital Z (real)</label>
		<input id="izr" type="number" step="0.1" />

		<label for="izi">Inital Z (imaginary)</label>
		<input id="izi" type="number" step="0.1" />

		<footer>
			By <a href="https://github.com/ethmarks">Ethan Marks</a>
		</footer>
	</div>

	<!-- "s" is for "stats"! -->
	<div id="s"></div>
	<style>
		body {
			margin: 0;
			text-shadow: 2px 2px 1px #000020;
			touch-action: none;
		}
		canvas {
			width: 100vw;
			height: 100vh;
			image-rendering: pixelated;
		}
		div {
			color: white;
			font-family: "Trebuchet MS", sans-serif;
			margin-left: 1rem;
			position: absolute;
			display: flex;
		}
		#t {
			top: 0;
			flex-direction: column;
			max-width: 50ch;
		}
		#s {
			bottom: 0;
			font-family: monospace;
		}
		#r {
			color: #01dfbc;
		}
		p {
			margin: 0.5rem 0;
		}
		input {
			padding: 6px 9px;
			border-radius: 6px;
			margin: 6px 0;
			border: none;
			color: white;

			/* imitating the colors of the edge of the bulb */
			background: black;
			box-shadow:
				0 0 0 1px #ee04ff,
				0 0 0 3px #f1ffff,
				0 0 1px 5px #01dfbc;
		}
		input:focus {
			outline: none;
		}
		a {
			color: #01dfbc;
		}
	</style>
	<script>
		/** @type {CanvasRenderingContext2D} */
		const ctx = c.getContext("2d");

		/** full detail, but very slow */
		const FULL_RES = 1;
		/** pixelated and looks like crap, but nearly instant */
		const PREVIEW_RES = 8;

		/** how long to wait before rendering in full resolution */
		const FULLRES_DELAY = 1000;

		// these two are similar but serve different purposes so let me explain
		/** this is to see more details of the fractal */
		let viewportScale = 300;
		/** this is to make rendering cheaper  */
		let superscaleFactor = 1;

		let viewportX = -0.5;
		let viewportY = 0;

		const SCROLL_SENSITIVITY = 1.0015;
		const DRAG_SENSITIVITY = 1;

		let initialZReal = 0;
		let initialZImaginary = 0;

		const MAX_ITERATIONS = 100;

		let imgData;
		let pixels;
		const updateCanvasDimensions = () => {
			c.width = innerWidth / superscaleFactor;
			c.height = innerHeight / superscaleFactor;
			imgData = ctx.getImageData(0, 0, c.width, c.height);
			pixels = imgData.data;
		};

		// https://www.stevenfrady.com/tools/palette?p=0.1,0.5,0.5,1,1,0.81,0.69,1,0.41,0.52,0.5,0.67
		function palette(t, colorIndex) {
			const a = [0.1, 0.5, 0.5];
			const b = [1, 1, 0.81];
			const c = [0.69, 1, 0.41];
			const d = [0.52, 0.5, 0.67];

			return (
				(a[colorIndex] +
					b[colorIndex] *
						Math.cos(
							2 * Math.PI * (c[colorIndex] * t + d[colorIndex]),
						)) *
				255
			);
		}

		/**
		 * this function mixes the palette calculation and image data math all
		 * in one
		 *
		 * @param pixelIndex the index of the pixel, obviously
		 * @param {number} t the 0-1 normalized value used to generate the color
		 */
		function setPixel(pixelIndex, t) {
			pixels[pixelIndex + 0] = palette(t, 0); // red
			pixels[pixelIndex + 1] = palette(t, 1); // green
			pixels[pixelIndex + 2] = palette(t, 2); // blue

			// I want the alpha value to always be fully opaque
			pixels[pixelIndex + 3] = 255;
		}

		function draw() {
			for (let pixelY = 0; pixelY < c.height; pixelY++) {
				for (let pixelX = 0; pixelX < c.width; pixelX++) {
					const scaledX =
						(pixelX - c.width / 2) /
							(viewportScale / superscaleFactor) +
						viewportX;
					const scaledY =
						(pixelY - c.height / 2) /
							(viewportScale / superscaleFactor) -
						viewportY;

					// each complex part of z
					let real = initialZReal;
					let imaginary = initialZImaginary;

					let iterations = 0;

					while (
						// escape condition cuz if the magnitude of z is ever
						// greater than 2, it's mathematically guaranteed to
						// approach infinity
						//
						// -> |z| < 2
						// -> sqrt(re^2 + im^2) < 2
						// -> re^2 + im^2 < 4
						real * real + imaginary * imaginary < 4 &&
						// because otherwise we'd never stop calculating for
						// some pixels
						iterations < MAX_ITERATIONS
					) {
						[real, imaginary] = [
							real * real - imaginary * imaginary + scaledX,
							2 * real * imaginary + scaledY,
						];

						iterations++;
					}

					const pixelIndex = (pixelY * c.width + pixelX) * 4;

					// https://en.wikipedia.org/wiki/Plotting_algorithms_for_the_Mandelbrot_set#Continuous_(smooth)_coloring
					const nu = Math.log2(
						Math.log2(real * real + imaginary * imaginary),
					);
					const smoothIterations = iterations + 1 - nu;

					const t =
						smoothIterations === MAX_ITERATIONS
							? 0
							: smoothIterations / MAX_ITERATIONS;

					setPixel(pixelIndex, t);
				}
			}

			ctx.putImageData(imgData, 0, 0);
		}

		function renderWithScale(scale) {
			superscaleFactor = scale;
			updateCanvasDimensions();
			draw();
		}

		let fullresTimeout;
		function render() {
			// updates the stats
			s.textContent = `center: ${viewportX}+${viewportY}i, zoom: ${Math.round(viewportScale / 300)}x`;

			clearTimeout(fullresTimeout);

			renderWithScale(PREVIEW_RES);

			fullresTimeout = setTimeout(() => {
				r.style.display = "unset";

				// setTimeout with zero delay, so that the browser can paint
				// the "(Rendering...)" before the main thread gets blocked.
				setTimeout(() => {
					renderWithScale(FULL_RES);
					r.style.display = "none";
				}, 0);
			}, FULLRES_DELAY);
		}

		window.addEventListener("resize", render);

		window.addEventListener("wheel", (event) => {
			viewportScale *= Math.pow(SCROLL_SENSITIVITY, -event.deltaY);
			render();
		});

		let isDragging;
		let centerX = 0;
		let centerY = 0;

		function resetDrag() {
			isDragging = false;
			document.body.style.cursor = "grab";
		}
		resetDrag();

		window.addEventListener("pointerdown", (event) => {
			isDragging = true;
			centerX = event.clientX;
			centerY = event.clientY;
			document.body.style.cursor = "grabbing";
		});

		window.addEventListener("pointerup", resetDrag);
		window.addEventListener("pointercancel", resetDrag);

		window.addEventListener("pointermove", (event) => {
			if (isDragging) {
				const dragDeltaX = event.clientX - centerX;
				const dragDeltaY = event.clientY - centerY;

				viewportX -= (dragDeltaX / viewportScale) * DRAG_SENSITIVITY;
				viewportY += (dragDeltaY / viewportScale) * DRAG_SENSITIVITY;

				centerX = event.clientX;
				centerY = event.clientY;

				render();
			}
			``;
		});

		// initialZRealEl
		izr.value = 0;
		// initialZImaginaryEl
		izi.value = 0;

		izr.addEventListener("input", () => {
			initialZReal = izr.value;
			render();
		});
		izi.addEventListener("input", () => {
			initialZImaginary = izi.value;
			render();
		});

		render();
	</script>
</body>
