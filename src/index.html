<body>
	<canvas id="c"></canvas>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background: black;
		}
	</style>
	<script>
		/** @type {CanvasRenderingContext2D} */
		const ctx = c.getContext("2d");

		const SCALE = 300;
		const MAX_ITERATIONS = 100;

		c.width = innerWidth;
		c.height = innerHeight;

		const imgData = ctx.getImageData(0, 0, c.width, c.height);
		const pixels = imgData.data;

		function draw() {
			for (let y = 0; y < c.height; y++) {
				for (let x = 0; x < c.width; x++) {
					const cx = (x - c.width / 2) / 300;
					const cy = (y - c.height / 2) / 300;

					let real = 0;
					let imaginary = 0;
					let iterations = 0;

					while (
						real * real + imaginary * imaginary < 4 &&
						iterations < MAX_ITERATIONS
					) {
						const realNext =
							real * real - imaginary * imaginary + cx;
						const imaginaryNext = 2 * real * imaginary + cy;

						real = realNext;
						imaginary = imaginaryNext;

						iterations++;
					}

					const brightness =
						iterations === MAX_ITERATIONS
							? 0
							: (255 * iterations) / MAX_ITERATIONS;

					const pixelIndex = (y * c.width + x) * 4;

					pixels[pixelIndex + 0] = brightness; // red
					pixels[pixelIndex + 1] = brightness; // green
					pixels[pixelIndex + 2] = brightness; // blue
					pixels[pixelIndex + 3] = 255; // alpha
				}
			}

			ctx.putImageData(imgData, 0, 0);
		}

		draw();
	</script>
</body>
