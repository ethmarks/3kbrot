<body>
	<canvas id="c"></canvas>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background: black;
		}
		canvas {
			width: 100vw;
			height: 100vh;
			image-rendering: pixelated;
		}
	</style>
	<script>
		/** @type {CanvasRenderingContext2D} */
		const ctx = c.getContext("2d");

		/** full detail, but very slow */
		const FULL_RES = 1;
		/** pixelated and looks like crap, but nearly instant */
		const PREVIEW_RES = 6;

		/** how long to wait before rendering in full resolution */
		const FULLRES_DELAY = 1000;

		// these two are similar but serve different purposes so let me explain
		/** this is to see more details of the fractal */
		let viewportScale = 300;
		/** this is to make rendering cheaper  */
		let superscaleFactor = 1;

		let viewportX = 0.25;
		let viewportY = 0;

		const SCROLL_SENSITIVITY = 1.0015;
		const DRAG_SENSITIVITY = 0.5;

		const MAX_ITERATIONS = 100;

		let imgData;
		let pixels;
		const updateCanvasDimensions = () => {
			c.width = innerWidth / superscaleFactor;
			c.height = innerHeight / superscaleFactor;
			imgData = ctx.getImageData(0, 0, c.width, c.height);
			pixels = imgData.data;
		};

		// https://www.stevenfrady.com/tools/palette?p=0.1,0.5,0.5,1,1,0.81,0.69,1,0.41,0.52,0.5,0.67
		function getPalette(t) {
			const a = [0.1, 0.5, 0.5];
			const b = [1, 1, 0.81];
			const c = [0.69, 1, 0.41];
			const d = [0.52, 0.5, 0.67];

			return (colorIndex) =>
				(a[colorIndex] +
					b[colorIndex] *
						Math.cos(
							2 * Math.PI * (c[colorIndex] * t + d[colorIndex]),
						)) *
				255;
		}

		/**
		 * this function mixes the palette calculation and image data math all
		 * in one
		 *
		 * @param pixelIndex the index of the pixel, obviously
		 * @param {number} t the 0-1 normalized value used to generate the color
		 */
		function setPixel(pixelIndex, t) {
			const palette = getPalette(t);

			pixels[pixelIndex + 0] = palette(0); // red
			pixels[pixelIndex + 1] = palette(1); // green
			pixels[pixelIndex + 2] = palette(2); // blue

			// I want the alpha value to always be fully opaque
			pixels[pixelIndex + 3] = 255;
		}

		function draw() {
			for (let pixelY = 0; pixelY < c.height; pixelY++) {
				for (let pixelX = 0; pixelX < c.width; pixelX++) {
					const scaledX =
						(pixelX - c.width / 2) /
							(viewportScale / superscaleFactor) +
						viewportX;
					const scaledY =
						(pixelY - c.height / 2) /
							(viewportScale / superscaleFactor) -
						viewportY;

					// each complex part of z
					let real = 0;
					let imaginary = 0;

					let iterations = 0;

					while (
						// escape condition cuz if the magnitude of z is ever
						// greater than 2, it's mathematically guaranteed to
						// approach infinity
						//
						// -> |z| < 2
						// -> sqrt(re^2 + im^2) < 2
						// -> re^2 + im^2 < 4
						real * real + imaginary * imaginary < 4 &&
						// because otherwise we'd never stop calculating for
						// some pixels
						iterations < MAX_ITERATIONS
					) {
						const realNext =
							real * real - imaginary * imaginary + scaledX;
						const imaginaryNext = 2 * real * imaginary + scaledY;

						real = realNext;
						imaginary = imaginaryNext;

						iterations++;
					}

					const pixelIndex = (pixelY * c.width + pixelX) * 4;

					// https://en.wikipedia.org/wiki/Plotting_algorithms_for_the_Mandelbrot_set#Continuous_(smooth)_coloring
					const nu = Math.log2(
						Math.log2(real * real + imaginary * imaginary),
					);
					const smoothIterations = iterations + 1 - nu;

					const t =
						smoothIterations === MAX_ITERATIONS
							? 0
							: smoothIterations / MAX_ITERATIONS;

					setPixel(pixelIndex, t);
				}
			}

			ctx.putImageData(imgData, 0, 0);
		}

		function renderWithScale(scale) {
			superscaleFactor = scale;
			updateCanvasDimensions();
			draw();
		}

		let fullresTimeout;
		function render() {
			clearTimeout(fullresTimeout);

			renderWithScale(PREVIEW_RES);

			fullresTimeout = setTimeout(
				() => renderWithScale(FULL_RES),
				FULLRES_DELAY,
			);
		}

		window.addEventListener("resize", render);

		window.addEventListener("wheel", (event) => {
			viewportScale *= Math.pow(SCROLL_SENSITIVITY, -event.deltaY);
			render();
		});

		let isDragging;
		let dragStartX = 0;
		let dragStartY = 0;

		function resetDrag() {
			isDragging = false;
			document.body.style.cursor = "grab";
		}
		resetDrag();

		window.addEventListener("pointerdown", (event) => {
			isDragging = true;
			dragStartX = event.clientX;
			dragStartY = event.clientY;
			document.body.style.cursor = "grabbing";
		});

		window.addEventListener("pointerup", resetDrag);
		window.addEventListener("pointercancel", resetDrag);

		window.addEventListener("pointermove", (event) => {
			if (!isDragging) return;

			const dragDeltaX = event.clientX - dragStartX;
			const dragDeltaY = event.clientY - dragStartY;

			viewportX -= (dragDeltaX / viewportScale) * DRAG_SENSITIVITY;
			viewportY += (dragDeltaY / viewportScale) * DRAG_SENSITIVITY;

			dragStartX = event.clientX;
			dragStarY = event.clienY;

			render();
		});

		render();
	</script>
</body>
